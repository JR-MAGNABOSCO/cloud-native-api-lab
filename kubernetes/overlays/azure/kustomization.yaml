apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/users
  - ../../base/orders
  - ../../base/frontend

images:
  - name: cloud-native-users-api
    newName: acrcloudnativeapilab.azurecr.io/cloud-native-users-api
    newTag: 1.5.1
  - name: cloud-native-orders-api
    newName: acrcloudnativeapilab.azurecr.io/cloud-native-orders-api
    newTag: 1.3.1
  - name: cloud-native-frontend
    newName: acrcloudnativeapilab.azurecr.io/cloud-native-frontend
    newTag: 1.0.0

patches:
  - path: configmap-patch.yaml
